<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyundai Vehicle Inventory System</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .link-btn{border:0;background:none;padding:10px 0;color:#1d4ed8;cursor:pointer;font:inherit}
    .link-btn:hover{text-decoration:underline}
    .message.success{color:#15803d}
    .message.error{color:#b91c1c}
  </style>
</head>
<body>
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark">H</div>
      <h1>KOTHARI HYUNDAI</h1>
      <p>Vehicle Inventory Management System</p>
      <form id="loginForm">
        <label>Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
        <button class="primary-btn" type="submit">Login</button>
      </form>
      <div id="loginMessage" class="message"></div>
      <small>Authorized users only</small>
    </div>
  </div>
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="brand-mark small">H</div>
        <div><strong>Kothari Hyundai</strong><span>Vehicle Inventory</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-footer">
        <span id="connectionDot" class="dot offline"></span>
        <span id="connectionText">Not connected</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Kothari Hyundai • Live Vehicle Inventory</p>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="secondary-btn">↻ Refresh</button>
          <div class="user-chip"><span id="userName">User</span><button id="logoutBtn">Logout</button></div>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
