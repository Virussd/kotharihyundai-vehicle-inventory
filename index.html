<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyundai Vehicle Inventory System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark">H</div>
      <h1>Hyundai Vehicle Inventory</h1>
      <p>Secure inventory management portal</p>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter email" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password" required>
        <button class="primary-btn" type="submit">Sign In</button>
      </form>
      <div id="loginMessage" class="message"></div>
      <small>Connect Supabase in <b>js/config.js</b> to enable live authentication.</small>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="brand-mark small">H</div>
        <div><strong>Hyundai</strong><span>Inventory</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-footer">
        <span id="connectionDot" class="dot offline"></span>
        <span id="connectionText">Not connected</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Live vehicle inventory overview</p>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="secondary-btn">↻ Refresh</button>
          <div class="user-chip"><span id="userName">User</span><button id="logoutBtn">Logout</button></div>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
